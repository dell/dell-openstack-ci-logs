all:
  children:
    tempest:
      hosts:
        controller: null
    zuul_unreachable:
      hosts: {}
  hosts:
    controller:
      ansible_connection: ssh
      ansible_host: <hidden>
      ansible_port: 22
      ansible_python_interpreter: auto
      ansible_user: zuul
      configure_swap_size: 8192
      devstack_local_conf:
        post-config:
          $CINDER_CONF:
            DEFAULT:
              osapi_volume_workers: 8
            cache:
              memcache_pool_maxsize: 80
          $MANILA_CONF:
            DEFAULT:
              enabled_share_backends: powerscale
              enabled_share_protocols: NFS,CIFS
              share_name_template: CI-%s
            powerscale:
              driver_handles_share_servers: false
              emc_nas_login: <hidden>
              emc_nas_password: <hidden>
              emc_nas_root_dir: /ifs/manila
              emc_nas_server: <hidden>
              emc_nas_server_port: 8080
              emc_share_backend: isilon
              emc_ssl_cert_verify: false
              enabled_share_protocols: NFS,CIFS
              share_backend_name: powerscale
              share_driver: manila.share.drivers.dell_emc.driver.EMCShareDriver
          $NOVA_CONF:
            libvirt:
              volume_use_multipath: true
        test-config:
          $TEMPEST_CONFIG:
            compute:
              min_compute_nodes: '{{ groups[''compute''] | default([''controller''])
                | length }}'
            share:
              backend_names: powerscale
              capability_create_share_from_snapshot_support: true
              create_networks_when_multitenancy_enabled: false
              default_share_type_name: dhss_false
              enable_ip_rules_for_protocols: nfs,cifs
              enable_protocols: nfs,cifs
              enable_sid_rules_for_protocols: cifs
              enable_user_rules_for_protocols: cifs
              image_with_share_tools: manila-service-image-master
              multitenancy_enabled: false
              run_consistency_group_tests: false
              run_driver_assisted_migration_tests: false
              run_extend_tests: true
              run_host_assisted_migration_tests: false
              run_ipv6_tests: false
              run_manage_unmanage_snapshot_tests: true
              run_manage_unmanage_tests: true
              run_migration_with_preserve_snapshots_tests: false
              run_mount_snapshot_tests: true
              run_quota_tests: true
              run_replication_tests: false
              run_revert_to_snapshot_tests: true
              run_share_group_tests: false
              run_shrink_tests: false
              run_snapshot_tests: true
              share_creation_retry_number: 2
              share_size: 10
              suppress_errors_in_cleanup: true
              username_for_user_rules: root
      devstack_localrc:
        ADMIN_PASSWORD: secretadmin
        CINDER_ENABLED_BACKENDS: NFS:isilon
        DATABASE_HOST: '{{ hostvars[''controller''][''nodepool''][''private_ipv4'']
          }}'
        DATABASE_PASSWORD: secretdatabase
        DATABASE_TYPE: mysql
        DEBUG_LIBVIRT_COREDUMPS: true
        ENABLE_CHASSIS_AS_GW: true
        ENABLE_SYSCTL_MEM_TUNING: true
        ENABLE_SYSCTL_NET_TUNING: true
        ENABLE_ZSWAP: true
        ERROR_ON_CLONE: false
        FIXED_RANGE: 10.1.0.0/20
        FLOATING_RANGE: 172.24.5.0/24
        HOST_IP: '{{ hostvars[''controller''][''nodepool''][''private_ipv4''] }}'
        IPV4_ADDRS_SAFE_TO_USE: 10.1.0.0/20
        LIBVIRT_TYPE: '{{ devstack_libvirt_type | default("qemu") }}'
        LOGFILE: /opt/stack/logs/devstacklog.txt
        LOG_COLOR: false
        MANILA_CONFIGURE_DEFAULT_TYPES: true
        MANILA_DHSS_FALSE_SHARE_TYPE_EXTRA_SPECS: share_backend_name=powerscale snapshot_support=True
          create_share_from_snapshot_support=True revert_to_snapshot_support=True
          mount_snapshot_support=True provisioning:mount_point_prefix=custom_ps_name_
        MANILA_SERVICE_IMAGE_URL: file:///openstack/cache/files/manila-service-image.qcow2
        NETWORK_GATEWAY: 10.1.0.1
        NOVA_LIBVIRT_TB_CACHE_SIZE: 128
        NOVA_VNC_ENABLED: true
        NOVNC_FROM_PACKAGE: true
        OVN_DBS_LOG_LEVEL: dbg
        OVN_NATIVE_DHCP: true
        PUBLIC_NETWORK_GATEWAY: 172.24.5.1
        Q_AGENT: ovn
        Q_ML2_PLUGIN_MECHANISM_DRIVERS: ovn
        Q_ML2_PLUGIN_TYPE_DRIVERS: flat,geneve
        RABBIT_HOST: '{{ hostvars[''controller''][''nodepool''][''private_ipv4'']
          }}'
        RABBIT_PASSWORD: secretrabbit
        SERVICE_HOST: '{{ hostvars[''controller''][''nodepool''][''private_ipv4'']
          }}'
        SERVICE_PASSWORD: secretservice
        SWIFT_HASH: 1234123412341234
        SWIFT_REPLICAS: 1
        SWIFT_START_ALL_SERVICES: false
        TEMPEST_PLUGINS: manila-tempest-plugin
        TEMPEST_STORAGE_PROTOCOL: NFS
        TEMPEST_VOLUME_DRIVER: EMC
        TEMPEST_VOLUME_VENDOR: Dell EMC
        VERBOSE: true
        VERBOSE_NO_TIMESTAMP: true
      devstack_plugins:
        manila: https://opendev.org/openstack/manila.git
        manila-tempest-plugin: https://opendev.org/openstack/manila-tempest-plugin
        manila-ui: https://opendev.org/openstack/manila-ui
      devstack_services:
        base: false
        c-api: true
        c-bak: true
        c-sch: true
        c-vol: true
        dstat: false
        etcd3: true
        file_tracker: true
        g-api: true
        horizon: false
        key: true
        m-api: true
        m-dat: true
        m-sch: true
        m-shr: true
        memory_tracker: true
        mysql: true
        n-api: true
        n-api-meta: true
        n-cond: true
        n-cpu: true
        n-novnc: true
        n-sch: true
        openstack-cli-server: true
        ovn-controller: true
        ovn-northd: true
        ovs-vswitchd: true
        ovsdb-server: true
        placement-api: true
        q-ovn-agent: true
        q-svc: true
        rabbit: true
        s-account: true
        s-container: true
        s-object: true
        s-proxy: true
        tempest: true
        tls-proxy: true
      extensions_to_txt:
        auto: true
        conf: true
        localrc: true
        log: true
        stackenv: true
        yaml: true
        yml: true
      nodepool:
        az: nova
        cloud: ci-cloud
        external_id: 7cd230a4-9f30-46bc-b554-94f53522a1c0
        host_id: d05ece891cf88d86783ece846ab9fd2a0585014d55a1b2a74e7a59f5
        interface_ip: 10.234.188.218
        label: nodepool-noble
        node_properties: {}
        private_ipv4: 10.19.119.207
        private_ipv6: null
        provider: ci-cloud
        public_ipv4: 10.234.188.218
        public_ipv6: ''
        region: null
        slot: null
      run_devstack: true
      run_tempest_tests: true
      tempest_concurrency: 4
      tempest_exclude_regex: test_create_share_with_size_bigger_than_quota
      tempest_test_regex: 'manila_tempest_tests.tests.api

        '
      test_results_stage_name: test_results
