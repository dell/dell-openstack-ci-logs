        public_ipv4: 10.234.188.213
        public_ipv6: ''
        region: null
        slot: null
      run_devstack: true
      run_tempest_tests: true
      tempest_concurrency: 4
      tempest_exclude_regex: test_volume_swap_with_multiattach|test_volume_retype_multiattach|test_available_volume_retype_with_migration|test_volume_from_snapshot_retype_with_migration|test_volume_migrate_attached
      tempest_test_regex: 'volume|^cinder_tempest_plugin

        '
