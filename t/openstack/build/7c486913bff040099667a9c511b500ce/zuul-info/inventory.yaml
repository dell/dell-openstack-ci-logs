        auto: true
        conf: true
        localrc: true
        log: true
        stackenv: true
        yaml: true
        yml: true
      nodepool:
        az: nova
        cloud: ci-cloud
        external_id: 0f2c6f28-7c3c-456c-b291-e025d1a05e6b
        host_id: d05ece891cf88d86783ece846ab9fd2a0585014d55a1b2a74e7a59f5
        interface_ip: 10.234.188.132
        label: nodepool-noble
