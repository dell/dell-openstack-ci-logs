      branch: master
      build: 7c486913bff040099667a9c511b500ce
      build_refs:
      - branch: master
        change: '1009405'
        change_message: '[Hitachi] Filter/sorting during group searches


          Host group searches can take an excessive amount of time, and they occur

          each time the service is restarted. In some environments, even with

          caching, this behavior can still cause very long deployment times and

          timeouts.


          This allows for a pattern-based filter to only search specific host

          groups, as well as an option to prioritize host groups created by other

          Hitachi software.


          Change-Id: I7cb1f19eb30952873b5f69092589d6d160e731cc

          Signed-off-by: Anthony Galica <anthony.galica@hitachivantara.com>

