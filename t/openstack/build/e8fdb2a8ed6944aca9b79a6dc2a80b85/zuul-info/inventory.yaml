      build_refs:
      - branch: master
        change: '1000801'
        change_message: "Dell PowerStore: Fix replicated volume delete and extend\n\nReplicated
          volumes with a PowerStore protection policy could fail\nduring deletion
          or extension. Deletion left volumes in error_deleting\nbecause the driver
          polled the /job endpoint for a completed deletion\njob with too few retries
          and did not verify the session was gone.\nExtension of standard replicated
          (including synchronous) volumes\nfailed with error 0xE0A080030036 because
          the driver did not pause\nthe replication session before extending.\n\nThis
          change:\n- Polls the replication session endpoint directly in\n  wait_for_replication_session_deletion
          and increases retries to\n  match the wait_for_end_metro behavior.\n- Adds
          pause_replication_session and resume_replication_session\n  client methods.\n-
          Pauses and resumes the replication session around extension for\n  all replicated
          volumes, not only metro volumes.\n\nCloses-Bug: #2163150\nChange-Id: Ie448e40b8bfd0aa61babc4aafbf866e55cbdeae2\nSigned-off-by:
          Siddharth Kumar <siddharth.kumar1@dell.com>\n"
