      powerflex2_san_password: <hidden>
      powerflex_sdc_deb: EMC-ScaleIO-sdc-4.5-4000.111.Ubuntu.24.04.x86_64.deb
      run_devstack: true
      run_tempest_tests: true
      tempest_concurrency: 4
