all:
  children:
    tempest:
      hosts:
        controller: null
    zuul_unreachable:
      hosts: {}
  hosts:
    controller:
      ansible_connection: ssh
      ansible_host: <hidden>
      ansible_port: 22
      ansible_python_interpreter: auto
      ansible_user: zuul
      configure_swap_size: 8192
      devstack_local_conf:
        post-config:
          $CINDER_CONF:
            DEFAULT:
              num_volume_device_scan_tries: 180
              osapi_volume_workers: 8
            backend_defaults:
              image_volume_cache_enabled: true
              num_volume_device_scan_tries: 180
              powerflex_allow_non_padded_volumes: true
              powerflex_storage_pools: PD1:SP1
              powerflex_unmap_volume_before_deletion: true
              san_ip: <hidden>
              san_login: <hidden>
              san_password: <hidden>
              suppress_requests_ssl_warnings: true
              use_multipath_for_image_xfer: true
              volume_driver: cinder.volume.drivers.dell_emc.powerflex.driver.PowerFlexNVMeDriver
            cache:
              memcache_pool_maxsize: 80
            powerflex1:
              volume_backend_name: powerflex1
            powerflex2:
              volume_backend_name: powerflex2
          $GLANCE_API_CONF:
            glance_store:
              default_store: file
          $NOVA_CONF:
            libvirt:
              volume_use_multipath: true
        test-config:
          $TEMPEST_CONFIG:
            compute:
              min_compute_nodes: '{{ groups[''compute''] | default([''controller''])
                | length }}'
            dell_driver:
              driver: powerflex
            validation:
              run_validation: true
              ssh_timeout: 600
            volume:
              build_timeout: 600
              volume_size: 8
              volume_size_extend: 8
            volume-feature-enabled:
              backup: true
              consistency_group: true
              extend_attached_encrypted_volume: true
              extend_attached_volume: true
              manage_snapshot: false
              manage_volume: false
              multi_backend: true
              volume_revert: true
      devstack_localrc:
        ADMIN_PASSWORD: secretadmin
        CINDER_ENABLED_BACKENDS: powerflex1,powerflex2
        DATABASE_HOST: '{{ hostvars[''controller''][''nodepool''][''private_ipv4'']
          }}'
        DATABASE_PASSWORD: secretdatabase
        DATABASE_TYPE: mysql
        DEBUG_LIBVIRT_COREDUMPS: true
        ENABLE_CHASSIS_AS_GW: true
        ENABLE_SYSCTL_MEM_TUNING: true
        ENABLE_SYSCTL_NET_TUNING: true
        ENABLE_VOLUME_MULTIATTACH: true
        ENABLE_ZSWAP: true
        ERROR_ON_CLONE: false
        FIXED_RANGE: 10.1.0.0/20
        FLOATING_RANGE: 172.24.5.0/24
        GLANCE_LIMIT_IMAGE_SIZE_TOTAL: 10000
        HOST_IP: '{{ hostvars[''controller''][''nodepool''][''private_ipv4''] }}'
        IPV4_ADDRS_SAFE_TO_USE: 10.1.0.0/20
        LIBVIRT_TYPE: '{{ devstack_libvirt_type | default("qemu") }}'
        LOGFILE: /opt/stack/logs/devstacklog.txt
        LOG_COLOR: false
        NETWORK_GATEWAY: 10.1.0.1
        NOVA_LIBVIRT_TB_CACHE_SIZE: 128
        NOVA_VNC_ENABLED: true
        NOVNC_FROM_PACKAGE: true
        OVN_DBS_LOG_LEVEL: dbg
        OVN_NATIVE_DHCP: true
        PUBLIC_NETWORK_GATEWAY: 172.24.5.1
        Q_AGENT: ovn
        Q_ML2_PLUGIN_MECHANISM_DRIVERS: ovn
        Q_ML2_PLUGIN_TYPE_DRIVERS: flat,geneve
        RABBIT_HOST: '{{ hostvars[''controller''][''nodepool''][''private_ipv4'']
          }}'
        RABBIT_PASSWORD: secretrabbit
        SERVICE_HOST: '{{ hostvars[''controller''][''nodepool''][''private_ipv4'']
          }}'
        SERVICE_PASSWORD: secretservice
        SWIFT_HASH: 1234123412341234
        SWIFT_REPLICAS: 1
        SWIFT_START_ALL_SERVICES: false
        TEMPEST_EXTEND_ATTACHED_VOLUME: true
        TEMPEST_PLUGINS: cinder-tempest-plugin
        TEMPEST_STORAGE_PROTOCOL: NVMe-TCP
        TEMPEST_VOLUME_DRIVER: EMC
        TEMPEST_VOLUME_VENDOR: Dell EMC
        VERBOSE: true
        VERBOSE_NO_TIMESTAMP: true
      devstack_services:
        base: false
        c-api: true
        c-bak: true
        c-sch: true
        c-vol: true
        dstat: false
        etcd3: true
        file_tracker: true
        g-api: true
        horizon: false
        key: true
        memory_tracker: true
        mysql: true
        n-api: true
        n-api-meta: true
        n-cond: true
        n-cpu: true
        n-novnc: true
        n-sch: true
        openstack-cli-server: true
        ovn-controller: true
        ovn-northd: true
        ovs-vswitchd: true
        ovsdb-server: true
        placement-api: true
        q-ovn-metadata-agent: true
        q-svc: true
        rabbit: true
        s-account: true
        s-container: true
        s-object: true
        s-proxy: true
        tempest: true
        tls-proxy: true
      extensions_to_txt:
        auto: true
        conf: true
        localrc: true
        log: true
        stackenv: true
        yaml: true
        yml: true
      nodepool:
        az: nova
        cloud: ci-cloud
        external_id: dfa6978a-5bd8-4751-91fb-e93bb75ece9d
        host_id: d05ece891cf88d86783ece846ab9fd2a0585014d55a1b2a74e7a59f5
