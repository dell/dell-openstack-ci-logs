        region: null
        slot: null
      powerflex1_san_password: <hidden>
      powerflex2_san_password: <hidden>
      run_devstack: true
      run_tempest_tests: true
      tempest_concurrency: 4
      tempest_exclude_regex: test_volume_migrate_attached.TestVolumeMigrateRetypeAttached|test_volume_swap_with_multiattach|test_volume_retype_multiattach
      tempest_test_regex: 'volume|^cinder_tempest_plugin

        '
      test_results_stage_name: test_results
