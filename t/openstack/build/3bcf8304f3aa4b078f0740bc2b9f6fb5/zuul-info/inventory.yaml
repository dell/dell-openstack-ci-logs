      ansible_version: '9'
      attempts: 1
      branch: master
      build: 3bcf8304f3aa4b078f0740bc2b9f6fb5
      build_refs:
      - branch: master
        change: '1003284'
        change_message: 'Dell PowerFlex: Add clone_image support for Cinder-backed
          Glance images


          When Glance uses Cinder as its image store on a PowerFlex backend,

          concurrent boot-from-volume requests can overwhelm the Glance image

          download path causing transient failures (HTTPInternalServerError,

          RescheduledException). This occurs because multiple concurrent

          operations attempt to read from the same shared image volume.


          This fix implements the clone_image() method in the PowerFlex driver

          to detect cinder:// image locations that reside on the same PowerFlex

          backend and clone them directly via a native PowerFlex snapshot,

          bypassing the Glance data path entirely. This eliminates the

          concurrent read contention on the shared image volume.


          The implementation:

          - Extracts Cinder volume IDs from cinder:// URLs in image locations

          - Validates image format (raw/bare) before attempting clone

          - Uses elevated context to look up image volumes (may belong to Glance tenant)

          - Checks backend host compatibility before cloning

          - Falls back to default image download on any error


          Closes-Bug: #2165416

          Change-Id: I0aa2f37fdd29cd9e145c9021ed05d0698ab238fc

          Signed-off-by: Siddharth Kumar <siddharth.kumar1@dell.com>

          '
