              san_login: <hidden>
              san_password: <hidden>
              suppress_requests_ssl_warnings: true
              use_multipath_for_image_xfer: true
              volume_driver: cinder.volume.drivers.dell_emc.powermax.nvme_tcp.PowerMaxNVMETCPDriver
            cache:
              memcache_pool_maxsize: 80
            powermax1:
              volume_backend_name: powermax1
            powermax2:
              volume_backend_name: powermax2
          $NOVA_CONF:
            DEFAULT:
              debug: false
            libvirt:
              num_volume_scan_tries: 60
              volume_use_multipath: true
        test-config:
