      ansible_version: '9'
      attempts: 1
      branch: master
      build: 9a15ef328cfa4d97b8b2b723e4914f72
      build_refs:
      - branch: master
        change: '1014464'
        change_message: 'Dell PowerScale: Default verify_ssl_cert to True


          PowerScaleApi defaulted verify_ssl_cert to False, so any caller that

          did not pass the argument explicitly would connect to the OneFS

          management API without validating the TLS certificate.


          The PowerScale driver always passes the emc_ssl_cert_verify option,

          which defaults to True, so the driver itself is not affected and

          deployments that set emc_ssl_cert_verify=False keep their behavior.

          Change the signature default to True so the class is secure by

          default for any direct caller, cover it with unit tests, and

          document the emc_ssl_cert_verify and emc_ssl_cert_path options.


          Closes-Bug: #2163229

          Assisted-By: Devin Claude Sonnet 5.5

          Change-Id: I5abe7408a6852a7ce42d5b3066270fde539690f8

          Signed-off-by: Siddharth Kumar <siddharth.kumar1@dell.com>

          '
