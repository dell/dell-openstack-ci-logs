    controller:
      ansible_connection: ssh
      ansible_host: <hidden>
      ansible_port: 22
      ansible_python_interpreter: auto
      ansible_user: zuul
      configure_swap_size: 8192
      devstack_local_conf:
        post-config:
          $CINDER_CONF:
            DEFAULT:
              num_volume_device_scan_tries: 180
              osapi_volume_workers: 8
            backend_defaults:
              image_volume_cache_enabled: true
              powerflex_storage_pools: PD1:SP1
              san_ip: <hidden>
              san_login: <hidden>
              san_password: <hidden>
              suppress_requests_ssl_warnings: true
              use_multipath_for_image_xfer: true
              volume_driver: cinder.volume.drivers.dell_emc.powerflex.driver.PowerFlexDriver
            cache:
              memcache_pool_maxsize: 80
            powerflex1:
              volume_backend_name: powerflex1
            powerflex2:
              volume_backend_name: powerflex2
          $GLANCE_API_CONF:
            glance_store:
              default_store: file
          $NOVA_CONF:
            libvirt:
              volume_use_multipath: true
        test-config:
          $TEMPEST_CONFIG:
            compute:
              min_compute_nodes: '{{ groups[''compute''] | default([''controller''])
                | length }}'
            dell_driver:
              driver: powerflex
            validation:
              run_validation: true
              ssh_timeout: 600
            volume:
              build_timeout: 600
              volume_size: 8
              volume_size_extend: 8
            volume-feature-enabled:
              backup: true
              consistency_group: true
              extend_attached_encrypted_volume: true
              extend_attached_volume: true
              manage_snapshot: false
              manage_volume: false
              multi_backend: true
              volume_revert: true
