      build_refs:
      - branch: master
        change: '1009439'
        change_message: 'Dell PowerFlex: Guard EC-specific volume size handling by
          generation


          PowerFlex v5/EC introduced generation-specific volume-size behavior.

          Without generation guards, EC-specific logic is applied to PowerFlex

          v4/Mirroring systems and causes volume boot workflows to fail.


          Add generation guards for volume creation and source-based provisioning,

          initialize the secondary client''s generation type for failover, and

          handle malformed EC metrics responses without leaking parsing errors.


          Closes-Bug: #2169929

          Assisted-By: Devin (Claude)

          Change-Id: Icd89ce252bf1f25e69717863131c5fc141ae6aff

          Signed-off-by: Siddharth Kumar <siddharth.kumar1@dell.com>

          '
