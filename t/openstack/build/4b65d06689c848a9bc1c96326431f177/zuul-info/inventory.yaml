      - branch: master
        change: '1014456'
        change_message: 'Dell PowerStore: Add DHSS=True mode support


          Add Driver Handles Share Servers (DHSS=True) mode to the Dell PowerStore

          Manila driver for automatic NAS server management. This enables

          multi-tenant isolation with per-share-network NAS servers.


          Key changes:

          - Add NAS server CRUD operations to PowerStore client

          - Add file interface, NFS server, SMB server management

          - Implement setup_server/teardown_server for share server lifecycle

          - Add _get_nas_server_id/_get_nas_server_name for dual-mode support

          - Add CIDR-to-prefix-length conversion utility

          - Support both DHSS=True and DHSS=False in single driver

          - Add comprehensive unit tests for all new functionality

          - Update documentation with DHSS=True configuration guide

          - Add release note for the new feature


          Blueprint: dell-powerstore-dhss-true

          Change-Id: Iab817b81434bfae1365875a6c6dc8870f800fc13

