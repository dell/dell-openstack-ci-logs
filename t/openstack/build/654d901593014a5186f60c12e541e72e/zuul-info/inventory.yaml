        auto: true
        conf: true
        localrc: true
        log: true
        stackenv: true
        yaml: true
        yml: true
      nodepool:
        az: nova
        cloud: ci-cloud
        external_id: 8dd80095-9ecf-4535-ac51-ecb12efad898
        host_id: d05ece891cf88d86783ece846ab9fd2a0585014d55a1b2a74e7a59f5
