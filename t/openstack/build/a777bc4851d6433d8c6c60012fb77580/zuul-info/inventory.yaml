      build_refs:
      - branch: master
        change: '1004441'
        change_message: 'Make dellfcopy optional for PowerStore NFS


          The PowerStore NFS driver fails to initialize when the proprietary

          dellfcopy utility is not installed, even though only clone and

          create-volume-from-snapshot operations require it.


          Detect the utility during setup and fall back to cp when unavailable.

          This preserves the source image format required by qcow2 rebasing and

          volume metadata. Continue using fast-clone offload when installed.


          Closes-Bug: #2166699


          Change-Id: I6cda5d2c9d41156250cd46c7f7864e8448d2c5b9

